</head>
<body>
    <header class="hero">
        <a href="#main" class="site-title">Перейти до основного вмісту</a>

        <nav>
            <ul class="menu">
                <li><a href="index.html">Головна</a></li>
                <li><a href="about.html">Про напрям</a></li>
                <li><a href="comparison.html">Порівняння</a></li>

                <li class="menu__contacts"><a href="pages/resources.html">Ресурси</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <h1>Зворотний зв'язок</h1>

        <form action="https://httpbin.org/post" method="post">

            <label for="name">Ім'я</label>
           
            <br><br>

            <label for="email">Електронна пошта</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <button type="submit" class="btn">Надіслати</button>
        </form>

        <label for="subject">Тема звернення</label>
        <select id="subject" name="subject">
            <option value="question">Запитання</option>
            <option value="suggestion">Пропозиція</option>
            <option value="error">Повідомлення про помилку на сайті</option>
        </select>
        <br><br>

        <label for="message">Текст повідомлення</label><br>
        <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
        <br><br>

        <label>
            <input type="checkbox" name="consent" required>
            Погоджуюсь на обробку персональних даних
        </label>
        <br><br>

        <button type="submit" class="btn">Надіслати</button>
    </main>
</body>
</html>
