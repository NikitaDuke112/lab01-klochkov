<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg_title svg_desc">
    <title id="svg_title">Основні типи машинного навчання</title>
    <desc id="svg_desc">Три вертикальні картки, що описують типи машинного навчання: з учителем, без учителя та з підкріпленням.</desc>
    <g id="types_list" role="list">
        <g id="supervised" role="listitem" aria-labelledby="sup_label">
            <rect x="50" y="30" width="500" height="90" rx="10" ry="10" fill="#FFE082" stroke="#BCAAA4" stroke-width="2" />
            <text id="sup_label" x="70" y="65" font-family="Verdana" font-size="20" font-weight="bold" fill="#3E2723">Навчання з учителем</text>
            <line x1="70" y1="80" x2="530" y2="80" stroke="#3E2723" stroke-width="2" />
            <text x="70" y="100" font-family="Verdana" font-size="14" fill="#3E2723">Приклади: Класифікація, Регресія</text>
        </g>

        <g id="unsupervised" role="listitem" aria-labelledby="unsup_label">
            <rect x="50" y="150" width="500" height="90" rx="10" ry="10" fill="#81D4FA" stroke="#0288D1" stroke-width="2" />
            <text id="unsup_label" x="70" y="185" font-family="Verdana" font-size="20" font-weight="bold" fill="#01579B">Навчання без учителя</text>
            <line x1="70" y1="200" x2="530" y2="200" stroke="#01579B" stroke-width="2" />
            <text x="70" y="220" font-family="Verdana" font-size="14" fill="#01579B">Приклади: Кластеризація, Зменшення розмірності</text>
        </g>

        <g id="reinforcement" role="listitem" aria-labelledby="rl_label">
            <rect x="50" y="270" width="500" height="90" rx="10" ry="10" fill="#C8E6C9" stroke="#388E3C" stroke-width="2" />
            <text id="rl_label" x="70" y="305" font-family="Verdana" font-size="20" font-weight="bold" fill="#1B5E20">Навчання з підкріпленням</text>
            <line x1="70" y1="320" x2="530" y2="320" stroke="#1B5E20" stroke-width="2" />
            <text x="70" y="340" font-family="Verdana" font-size="14" fill="#1B5E20">Приклади: Робототехніка, Ігри (Агент у середовищі)</text>
        </g>

    </g>
</svg>
